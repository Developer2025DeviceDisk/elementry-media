name: Backend checks

on:
  push:
    paths: ['Backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['Backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      TEST_MONGODB_DATABASE: commerce_test
      TEST_MONGODB_TRANSACTIONS: 'true'
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name commerce-mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec commerce-mongodb mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec commerce-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          docker exec commerce-mongodb mongosh --quiet --eval 'for(let i=0;i<30 && !db.hello().isWritablePrimary;i++) sleep(1000); if(!db.hello().isWritablePrimary) throw new Error("Replica set not ready")'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
